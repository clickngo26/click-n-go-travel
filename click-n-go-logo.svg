<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Click N Go Travel Hub logo</title>
  <desc id="desc">A navy C shaped route with a coral paper plane, followed by the Click N Go Travel Hub wordmark.</desc>
  <rect width="1200" height="360" rx="40" fill="#FFF8ED"/>
  <g transform="translate(62 54)">
    <circle cx="126" cy="126" r="112" fill="#102A43"/>
    <path d="M177 66A78 78 0 1 0 183 184" fill="none" stroke="#FFF8ED" stroke-linecap="round" stroke-width="29"/>
    <path d="M153 70C187 72 214 100 218 134" fill="none" stroke="#FF6B4A" stroke-dasharray="7 12" stroke-linecap="round" stroke-width="7"/>
